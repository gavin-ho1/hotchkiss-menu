[package]
name = "hotchkiss-menu"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
